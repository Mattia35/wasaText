openapi: 3.0.3
info:
  title: Simplified login API specification
  description: |-
    This OpenAPI document describes the simplified login API.
    Copy and paste the API from the `paths` key to your OpenAPI document.
  version: "1"
  
components:
  securitySchemes:
    bearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT # optional, arbitrary value for documentation purposes
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
    InvalidRequestError:
      description: bad request
      content:
        application/json:
          schema:
            description: '400 error'
            type: object
            properties:
              error_message:
                description: text of error message
                type: string
                pattern: '^.*?$'
                minLength: 1
                maxLength: 30
                example: "Bad request, retry!" 
    ForbiddenError:
      description: bad request
      content:
        application/json:
          schema:
            description: '403 error'
            type: object
            properties:
              error_message:
                description: text of error message
                type: string
                pattern: '^.*?$'
                minLength: 1
                maxLength: 50
                example: "User is not allowed to perform the action!" 
    InternalServerError:
      description: server error
      content:
        application/json:
          schema:
            description: '500 error'
            type: object
            properties:
              error_message:
                description: text of error message
                type: string
                pattern: '^.*?$'
                minLength: 1
                maxLength: 30
                example: "Server error, try again later!"
    NotFoundError:
      description: server error
      content:
        application/json:
          schema:
            description: '404 error'
            type: object
            properties:
              error_message:
                description: text of error message
                type: string
                pattern: '^.*?$'
                minLength: 1
                maxLength: 30
                example: "The object is not found!"
  schemas:
    GeneralId:
      type: object
      description: id of a user, a conversation, a group, a message or a comment
      properties:
        value:
          type: integer
          description: id value
          minimum: 0
          maximum: 10000
    Username:
      type: object
      description: username
      properties:
        name:
          type: string
          description: | 
            text that represents the username 
          pattern: '^[a-z0-9]{1,15}$'
          minLength: 1
          maxLength: 15
      required: [name]
    Message:
      type: object
      description: message of a conversation
      properties:
        id:
          $ref: '#/components/schemas/GeneralId'
        date_time:
          type: string
          description: date and time of the message
          format: date-time
          pattern: '^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])T([01]\\d|2[0-3]):[0-5]\\d$'
          minLength: 16
          maxLength: 16
        text:
          description: text of the message
          type: string
          pattern: '^.*?$'
          minLength: 1
          maxLength: 9999
        status:
          type: boolean
          description: status of the message
        conv_id:
          $ref: '#/components/schemas/GeneralId'
        sender_id:
          $ref: '#/components/schemas/GeneralId'
        photo:
          type: string
          description: photo of the message
          format: byte
          pattern: '^.*?$'
          minLength: 1
          maxLength: 7000000
        gif:
          type: string
          description: gif of the message
          format: byte
          pattern: '^.*?$'
          minLength: 1
          maxLength: 7000000
        forward:
          type: boolean
          description: define if is a forwarded message
        reply_id:
          $ref: '#/components/schemas/GeneralId'
    Conversation:
      type: object
      description: conversation of a private chat or a group
      properties:
        conv_id:
          $ref: '#/components/schemas/GeneralId'
        group_id:
          $ref: '#/components/schemas/GeneralId'
        last_message:
          $ref: '#/components/schemas/Message'
      required: [conv_id, group_id, last_message]
    Group:
      type: object
      description: group with other users
      properties:
        id:
          $ref: '#/components/schemas/GeneralId'
        group_name:
          type: string
          description: text that represents the group name
          pattern: '^.*?$'
          minLength: 1
          maxLength: 20
        photo:
          type: string
          description: group photo
          pattern: '^.*?$'
          format: byte
          minLength: 1
          maxLength: 7000000
      required: [id, group_name]
    User:
      type: object
      description: general user
      properties:
        id:
          $ref: '#/components/schemas/GeneralId'
        user_name:
          $ref: '#/components/schemas/Username'
        photo:
          type: string
          description: group photo
          pattern: '^.*?$'
          format: byte
          minLength: 1
          maxLength: 7000000
      required: [id, user_name]
      
tags:
  - name: login
    description: User authentication operations.
  - name: creation of a private chat
    description: Operations for creating private chats.
  - name: getting all conversations
    description: Retrieve all user conversations.
  - name: getting messages from a conversation
    description: Fetch messages from a specific conversation.
  - name: sending a message
    description: Operations related to sending messages.
  - name: forwarding of a message
    description: Forward messages between conversations.
  - name: deleting of a message
    description: Delete a specific message.
  - name: comment creation
    description: Add comments to messages.
  - name: deleting of a comment
    description: Remove comments from messages.
  - name: creation of a group
    description: Create a new group.
  - name: users group modify
    description: Modify users within a group.
  - name: deleting of a group
    description: Delete a specific group.
  - name: group photo modify
    description: Update the photo of a group.
  - name: group name modify
    description: Change the name of a group.
  - name: username modify
    description: Update the username of a user.
  - name: photo modify
    description: Modify the user's profile photo.
  - name: search users
    description: Search of all users who have the username starting with an input string
    
paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created, and an identifier is returned. If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              description: object that contains the new username in input
              properties:
                username:
                  $ref: '#/components/schemas/Username'
        required: true
      responses:
        '200':
          description: User login action successful
          content:
            application/json:
              schema:
                type: object
                description: '200 response message'
                properties:
                  id:
                    $ref: '#/components/schemas/GeneralId'
        '201':
          description: User creation action successful
          content:
            application/json:
              schema:
                type: object
                description: '201 response message'
                properties:
                  id:
                    $ref: '#/components/schemas/GeneralId'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /users:
    description: area where is possibile to search users
    get:
      security:
        - bearerAuth: []
      tags: ["search users"]
      operationId: searchUsers
      summary: get a list of users
      description: get a list of users who have the username starting with an input string
      responses:
        '200':
          description: |
            an array of object, each one contains a name, a message,
            a array users and a photo
          content:
            application/json:
              schema:
                type: object
                description: '200 response message'
                properties: 
                  filtered_users:
                    description: conversations array in output
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                    minItems: 0
                    maxItems: 10000
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /users/{user}/conversations:
    description: user area where he can read and create chats
    parameters:
      - name: user
        description: user id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
    get:
      security:
        - bearerAuth: []
      tags: ["getting all conversations"]
      operationId: getMyConversations
      summary: gets a conversations list
      description: User gets all conversations
      responses:
        '200':
          description: |
            an array of object, each one contains a name, a message,
            a array users and a photo
          content:
            application/json:
              schema:
                type: object
                description: '200 response message'
                properties: 
                  conversations:
                    description: conversations array in output
                    type: array
                    items:
                      type: object
                      description: object with all data of a conversation
                      properties: 
                        conversation:
                          $ref: '#/components/schemas/Conversation'
                        user:
                          $ref: '#/components/schemas/User'
                        group:
                          $ref: '#/components/schemas/Group'
                        group_users:
                          description: members of the group
                          type: array
                          items:
                            $ref: '#/components/schemas/User'
                          minItems: 1
                          maxItems: 10000
                        message:
                          $ref: '#/components/schemas/Message'
                        sender_user:
                          $ref: '#/components/schemas/User'
                        date_time:
                          type: string
                          description: date and time of the last message
                          format: date-time
                          pattern: '^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])T([01]\\d|2[0-3]):[0-5]\\d$'
                          minLength: 16
                          maxLength: 16
                      required: [conversation, user, group, group_users, message, sender_user, date_time]
                    minItems: 0
                    maxItems: 10000
                required: [conversations]
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      security:
        - bearerAuth: []
      tags: ["creation of a private chat"]
      summary: New chat or group conversation is created
      description: |
        User creates a new chat with a other user or a new group with some users
      operationId: conversationCreation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: object that contains a username and a text
              properties:
                username:
                  $ref: '#/components/schemas/Username'
                text:
                  description: text of the message
                  type: string
                  pattern: '^.*?$'
                  minLength: 1
                  maxLength: 9999
      responses:
        '201':
          description: New chat creaction action successful
          content:
            plain/text:
              schema: 
                description: '201 response message'
                type: string
                pattern: '^.*?$'
                minLength: 1
                maxLength: 45
                example: 'Forwarding accepted!'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  /users/{user}/conversations/{conv_id}:
    description: | 
      user area where he can do an interaction with a chat,
      identified by the id
    parameters:
      - name: user
        description: user id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
      - name: conv_id
        description: receiver id (group or user)
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
    get:
      security:
        - bearerAuth: []
      tags: ["getting messages from a conversation"]
      operationId: getConversation
      summary: gets a messages list of a conversation
      description: | 
        User gets all messages of a conversation that is 
        identified by a id
      responses:
        '200':
          description: |
            an array of object (contained in the conversation in output), each one contains a name, a message, a array users and a photo
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /users/{user}/conversations/{conv_id}/messages:
    description: messages area, where user can send text, photo and gif
    parameters:
      - name: user
        description: user id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
      - name: conv_id
        description: conv id 
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
    post:
      security:
        - bearerAuth: []
      tags: ["sending a message"]
      operationId: sendMessage
      summary: sends a message (so, adds it to list of messages a conversation)
      description: | 
        User sends a message to the other user/s
      requestBody:
        content:
          multipart/form-data::
            schema:
              type: object
              description: object that contains message input data
              properties:
                text:
                  type: string
                  description: text of the message
                  pattern: '^.*?$'
                  minLength: 1
                  maxLength: 9999
                messToReplyTo:
                  $ref: '#/components/schemas/GeneralId'
                image:
                  description: new image in input
                  type: string
                  pattern: '^.*?$'
                  format: byte
                  minLength: 1
                  maxLength: 7000000
                gif:
                  description: new gif in input
                  type: string
                  pattern: '^.*?$'
                  format: byte
                  minLength: 1
                  maxLength: 7000000
        required: true
      responses:
        '201':
          description: New message sending action successful
          content:
            application/json:
              schema:
                type: object
                description: object that contains message input data
                properties:
                  mess:
                    $ref: '#/components/schemas/Message'
                  mess_to_reply:
                    $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  /users/{user}/conversations/{conv_id}/messages/{mess_id}:
    description: message area, where user can forward or delete it
    parameters:
      - name: user
        description: user id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
      - name: conv_id
        description: receiver id (group or user)
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
      - name: mess_id
        description: message id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
    post:
      security:
        - bearerAuth: []
      tags: ["forwarding of a message"]
      operationId: forwardMessage
      summary: forwards the message
      description: User forwards a message in a chat, represented by his id
      requestBody:
        description: User gives the chat id in input
        content:
          application/json:
            schema:
              type: object
              description: object that contains array of conversations data
              properties:
                destination:
                  description: conversations array in input
                  type: array
                  items:
                    type: object
                    description: object with all data of a conversation
                    properties: 
                      user_id:
                        $ref: '#/components/schemas/GeneralId'
                      group_id:
                        $ref: '#/components/schemas/GeneralId'
                  minItems: 0
                  maxItems: 10000
      responses:
        '201':
          description: message forwarding action successful
          content:
            application/json:
              schema:
                description: '201 response message'
                type: object
                properties:
                  messages:
                    description: '201 response message'
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                    minItems: 0
                    maxItems: 10000
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      security:
        - bearerAuth: []
      tags: ["deleting of a message"]
      operationId: deleteMessage
      summary: deletes the message
      description: User deletes a message
      responses:
        '200':
          description: message deletion action successful
          content:
            plain/text:
              schema:
                description: '200 response message'
                type: string
                pattern: '^.*?$'
                minLength: 1
                maxLength: 30
                example: "Deletion accepted!"
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{user}/conversations/{conv_id}/messages/{mess_id}/comments:
    description: comments area, where user can comment a message
    parameters:
      - name: user
        description: user id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
      - name: conv_id
        description: receiver id (group or user)
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
      - name: mess_id
        description: message id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
    put:
      security:
        - bearerAuth: []
      tags: ["comment creation"]
      operationId: commentMessage
      summary: new comment is created
      description: User comments the message defined by the messId
      requestBody:
        description: User gives emoji in input
        content:
          application/json:
            schema:
              type: object
              description: object that contains an emoji in input
              properties:
                emoji:
                  description: emoji in input
                  type: string
                  enum:
                    - "😀"
                    - "😂"
                    - "😍"
                    - "😎"
                    - "😭"
                    - "😡"
                    - "🎉"
                    - "❤️"
                    - "👍"
                    - "🔥"
        required: true
      responses:
        '200':
          description: Comment modify action successful
          content:
            application/json:
              schema:
                type: object
                description: object that contains comment output data
                properties:
                  id:
                    $ref: '#/components/schemas/GeneralId'
                  message_id:
                    $ref: '#/components/schemas/GeneralId'
                  emoji:
                    description: content of the comment, that is a emoji
                    type: string
                    enum:
                      - "😀"
                      - "😂"
                      - "😍"
                      - "😎"
                      - "😭"
                      - "😡"
                      - "🎉"
                      - "❤️"
                      - "👍"
                      - "🔥"
                  sender:
                    $ref: '#/components/schemas/User'
                  conv_id:
                    $ref: '#/components/schemas/GeneralId'
                required: [id, message_id, emoji, sender, conv_id]
        '201':
          description: New comment sending action successful
          content:
            application/json:
              schema:
                type: object
                description: object that contains comment output data
                properties:
                  id:
                    $ref: '#/components/schemas/GeneralId'
                  message_id:
                    $ref: '#/components/schemas/GeneralId'
                  emoji:
                    description: content of the comment, that is a emoji
                    type: string
                    enum:
                      - "😀"
                      - "😂"
                      - "😍"
                      - "😎"
                      - "😭"
                      - "😡"
                      - "🎉"
                      - "❤️"
                      - "👍"
                      - "🔥"
                  sender:
                    $ref: '#/components/schemas/User'
                  conv_id:
                    $ref: '#/components/schemas/GeneralId'
                required: [id, message_id, emoji, sender, conv_id]
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
      
  
  /users/{user}/conversations/{conv_id}/messages/{mess_id}/comments/{comm_id}:
    description: comment area, where user can delete it
    parameters:
      - name: user
        description: user id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
      - name: conv_id
        description: receiver id (group or user)
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
      - name: mess_id
        description: message id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
      - name: comm_id
        description: comment id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
    delete:
      security:
        - bearerAuth: []
      tags: ["deleting of a comment"]
      operationId: uncommentMessage
      summary: deletes the comment 
      description: |
        User deletes a comment (defined by the commId) on a message 
        (defined by the messId)
      responses:
        '200':
          description: comment deletion action successful
          content:
            plain/text:
              schema:
                description: '200 response message'
                type: string
                pattern: '^.*?$'
                minLength: 1
                maxLength: 30
                example: "Deletion accepted!"
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  /users/{user}/groups:
    description: user area where he can create group
    parameters:
      - name: user
        description: user id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
    post:
      security:
        - bearerAuth: []
      tags: ["creation of a group"]
      summary: New group is created
      description: User creates a new group with some users
      operationId: groupCreation
      requestBody:
        description: |
          User creates a new group with some users. He gives in input
          a array of users, a name and a photo for the group
        content:
          application/json:
            schema:
              type: object
              description: object that contains an array of user and groupname in input
              properties:
                users:
                  description: array of user ids in input 
                  type: array
                  items:
                    $ref: '#/components/schemas/User'
                  minItems: 1
                  maxItems: 49
                group_name:
                  description: group name in input
                  type: string
                  pattern: '^.*?$'
                  minLength: 1
                  maxLength: 20
              required: [group_name, users]
        required: true
      responses:
        '201':
          description: New group creaction action successful
          content:
            application/json:
              schema:
                type: object
                description: object that contains group data
                properties:
                  group:
                    $ref: '#/components/schemas/Group'
                  conv_id:
                    $ref: '#/components/schemas/GeneralId'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  /users/{user}/groups/{group_id}:
    description: user area where he can create group
    parameters:
      - name: user
        description: user id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
      - name: group_id
        description: group id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GeneralId'
    put:
      security:
        - bearerAuth: []
      tags: ["users group modify"]
      operationId: addToGroup
      summary: Adds users to group
      description: User Adds users to group, defined by the groupId
      requestBody:
        description: User gives an array of user in input
        content:
          application/json:
            schema:
              type: object
              description: object that contains an array of user in input
              properties:
                users:
                  description: user ids in input
                  type: array
                  items:
                    $ref: '#/components/schemas/User'
                  minItems: 1
                  maxItems: 49
        required: true
      responses:
        '200':
          description: group users list addition action successful
          content:
            application/json:
              schema:
                type: object
                description: object that contains an array of group members
                properties:
                  members:
                    description: members of the group, unless you
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                    minItems: 1
                    maxItems: 49
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
